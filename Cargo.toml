[workspace]
members = ["crates/monitor-contracts", "crates/monitor-core", "crates/monitor-adapters", "apps/desktop/src-tauri"]
default-members = ["crates/monitor-contracts", "crates/monitor-core", "crates/monitor-adapters"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
chrono = "0.4.42"
uuid = { version = "1.18", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
monitor-contracts = { path = "crates/monitor-contracts" }
monitor-core = { path = "crates/monitor-core" }
monitor-adapters = { path = "crates/monitor-adapters" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
