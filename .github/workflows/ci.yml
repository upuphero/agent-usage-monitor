name: Validate, package and release
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore', '.gitattributes']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contracts, migration, frontend and source boundaries
        run: pnpm check
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test contracts, rules and persistence
        run: cargo test --locked
      - name: Lint Rust libraries
        run: cargo clippy --all-targets --locked -- -D warnings
  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - name: Build independent Windows NSIS installer
        run: pnpm --filter @monitor/desktop exec tauri build --bundles nsis -- --locked
      - name: Test native host and storage
        run: cargo test --workspace --release --features monitor-desktop/custom-protocol --locked
      - name: Lint native host
        run: cargo clippy -p monitor-desktop --release --features custom-protocol --all-targets --locked -- -D warnings
      - name: Stage installer, portable executable and hashes
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-usage-monitor-windows-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    needs: [validate, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish version tag and separate Windows release assets
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "agent-usage-monitor-windows-$env:GITHUB_SHA" --dir artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Could not download validated Windows packages' }
          ./scripts/publish-release.ps1 -ArtifactDirectory artifacts/windows -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY
