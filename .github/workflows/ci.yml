name: Validate, package and release
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore', '.gitattributes']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contracts, migration, frontend and source boundaries
        run: pnpm check
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test contracts, rules and persistence
        run: cargo test --locked
      - name: Lint Rust libraries
        run: cargo clippy --all-targets --locked -- -D warnings
  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - name: Build independent Windows NSIS installer
        run: pnpm --filter @monitor/desktop exec tauri build --bundles nsis -- --locked
      - name: Test native host and storage
        run: cargo test --workspace --release --features monitor-desktop/custom-protocol --locked
      - name: Build Windows log collector
        run: cargo build -p monitor-collector --release --locked
      - name: Lint native host
        run: cargo clippy -p monitor-desktop --release --features custom-protocol --all-targets --locked -- -D warnings
      - name: Stage installer, portable executable and hashes
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-usage-monitor-windows-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test native Mac collector and log merge
        run: cargo test -p monitor-contracts -p monitor-core -p monitor-adapters -p monitor-collector --release --locked
      - name: Lint Mac collector
        run: cargo clippy -p monitor-collector -p monitor-adapters -p monitor-core --release --all-targets --locked -- -D warnings
      - name: Package Mac collector
        shell: bash
        env:
          COLLECTOR_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          cargo build -p monitor-collector --release --locked
          version=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p artifacts/macos/stage
          codesign --force --sign - target/release/monitor-collector
          target/release/monitor-collector --version
          cp target/release/monitor-collector LICENSE docs/device-collection.md artifacts/macos/stage/
          name="Agent-Usage-Monitor_${version}_macos-${COLLECTOR_ARCH}-collector.tar.gz"
          tar -czf "artifacts/macos/$name" -C artifacts/macos/stage .
          (cd artifacts/macos && shasum -a 256 "$name" > "SHA256SUMS-macos-${COLLECTOR_ARCH}.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-usage-monitor-macos-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            artifacts/macos/*.tar.gz
            artifacts/macos/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    needs: [validate, windows, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish version tag, Windows packages and Mac collectors
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "agent-usage-monitor-windows-$env:GITHUB_SHA" --dir artifacts/windows
          if ($LASTEXITCODE -ne 0) { throw 'Could not download validated Windows packages' }
          foreach ($architecture in @('arm64','x64')) {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "agent-usage-monitor-macos-$architecture-$env:GITHUB_SHA" --dir artifacts/windows
            if ($LASTEXITCODE -ne 0) { throw 'Could not download validated Mac collector' }
            Get-Content -LiteralPath "artifacts/windows/SHA256SUMS-macos-$architecture.txt" | Add-Content -LiteralPath artifacts/windows/SHA256SUMS.txt
          }
          ./scripts/publish-release.ps1 -ArtifactDirectory artifacts/windows -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY
